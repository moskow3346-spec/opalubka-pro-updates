name: Verify public downloads are paused

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-public-downloads.yml'

permissions:
  contents: read

jobs:
  verify-public-downloads:
    if: github.repository == 'moskow3346-spec/opalubka-pro-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all preserved release assets without authentication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['TARGET_REPOSITORY']
          if repository != 'moskow3346-spec/opalubka-pro-updates':
              raise SystemExit('Unexpected repository; verification stopped.')
          api = 'https://api.github.com/repos/' + repository
          website = 'https://github.com/' + repository
          common = {
              'User-Agent': 'opalubka-anonymous-download-verification',
              'Accept': 'application/vnd.github+json',
              'Cache-Control': 'no-cache',
          }

          def read_json(url, authenticated=False):
              headers = dict(common)
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          # Use the scoped token ONLY to inventory the owner's preserved drafts.
          releases = []
          page = 1
          while True:
              batch = read_json(api + '/releases?per_page=100&page=' + str(page), True)
              if not isinstance(batch, list):
                  raise SystemExit('Unexpected authenticated inventory response.')
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          published = [r for r in releases if not r.get('draft')]
          print('Authenticated inventory: releases=' + str(len(releases)) + ', published=' + str(len(published)), flush=True)
          if published:
              raise SystemExit('Published releases remain.')

          # Everything below uses new requests with NO token, cookies, or login.
          public_releases = read_json(api + '/releases?per_page=100')
          if not isinstance(public_releases, list):
              raise SystemExit('Unexpected public release listing response.')
          print('Anonymous public release count: ' + str(len(public_releases)), flush=True)
          if public_releases:
              raise SystemExit('Anonymous visitors can still see published releases.')

          checks = []
          for release in releases:
              tag = str(release['tag_name'])
              for asset in release.get('assets', []):
                  filename = str(asset['name'])
                  path = '/releases/download/' + urllib.parse.quote(tag, safe='') + '/' + urllib.parse.quote(filename, safe='')
                  checks.append((tag + '/' + filename, website + path))
          checks.append(('latest installer', website + '/releases/latest/download/OpalubkaDomstroy.OpalubkaPro-win-Setup.exe'))

          failures = []
          for label, url in checks:
              req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': common['User-Agent'], 'Cache-Control': 'no-cache'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              print('Anonymous HTTP ' + str(status) + ': ' + label, flush=True)
              if status != 404:
                  failures.append(label + ': HTTP ' + str(status))
          print('Anonymous links tested: ' + str(len(checks)), flush=True)
          print('Unexpected results: ' + str(len(failures)), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Anonymous download verification\n')
              output.write('- Public releases visible without login: ' + str(len(public_releases)) + '\n')
              output.write('- Old download links tested: ' + str(len(checks)) + '\n')
              output.write('- Unexpected results: ' + str(len(failures)) + '\n')
              output.write('\nNo releases, files, tags, or settings were changed by this verification.\n')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('VERIFIED: all tested public download links return HTTP 404.', flush=True)
          PY
