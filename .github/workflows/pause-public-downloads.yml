name: Verify every paused download link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-public-downloads.yml'

permissions: {}

jobs:
  verify-public-downloads:
    if: github.repository == 'moskow3346-spec/opalubka-pro-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test the complete known file list anonymously
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = 'moskow3346-spec/opalubka-pro-updates'
          website = 'https://github.com/' + repository
          api = 'https://api.github.com/repos/' + repository
          headers = {'User-Agent': 'opalubka-anonymous-download-verification', 'Cache-Control': 'no-cache'}
          # This step receives no GitHub token. All requests are anonymous.
          # The exact releases and filenames were read through the owner's connection.
          draft_tags = {
              '1.0.27': 'untagged-8aa011799455419ee985',
              '1.0.26': 'untagged-296686eee78a7e28e87e',
          }
          checks = []
          original_count = 0
          for version, draft_tag in draft_tags.items():
              filenames = [
                  'OpalubkaDomstroy.OpalubkaPro-' + version + '-delta.nupkg',
                  'OpalubkaDomstroy.OpalubkaPro-' + version + '-full.nupkg',
                  'OpalubkaDomstroy.OpalubkaPro-win-Portable.zip',
                  'OpalubkaDomstroy.OpalubkaPro-win-Setup.exe',
                  'RELEASES',
                  'releases.win.json',
              ]
              for filename in filenames:
                  original_count += 1
                  for tag in ['v' + version, draft_tag]:
                      path = '/releases/download/' + urllib.parse.quote(tag, safe='') + '/' + urllib.parse.quote(filename, safe='')
                      checks.append((tag + '/' + filename, website + path))
          checks.append(('latest installer', website + '/releases/latest/download/OpalubkaDomstroy.OpalubkaPro-win-Setup.exe'))
          if original_count != 12 or len(checks) != 25:
              raise SystemExit('Incomplete verification target list.')

          req = urllib.request.Request(api + '/releases?per_page=100', headers=headers)
          with urllib.request.urlopen(req, timeout=20) as response:
              public_releases = json.load(response)
          if not isinstance(public_releases, list):
              raise SystemExit('Unexpected public release listing response.')
          print('Anonymous public release count: ' + str(len(public_releases)), flush=True)
          if public_releases:
              raise SystemExit('Anonymous visitors can still see published releases.')

          failures = []
          for label, url in checks:
              req = urllib.request.Request(url, method='HEAD', headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              print('Anonymous HTTP ' + str(status) + ': ' + label, flush=True)
              if status != 404:
                  failures.append(label + ': HTTP ' + str(status))
          print('Original asset links tested: ' + str(original_count), flush=True)
          print('Total links tested, including drafts and latest: ' + str(len(checks)), flush=True)
          print('Unexpected results: ' + str(len(failures)), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Anonymous download verification\n')
              output.write('- Public releases: ' + str(len(public_releases)) + '\n')
              output.write('- Original asset links checked: ' + str(original_count) + '\n')
              output.write('- Total links checked including draft URLs and latest installer: ' + str(len(checks)) + '\n')
              output.write('- Unexpected results: ' + str(len(failures)) + '\n')
              output.write('\nThis verification used no credentials and changed no files or releases.\n')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('VERIFIED: all 25 download links return HTTP 404 without authentication.', flush=True)
          PY
